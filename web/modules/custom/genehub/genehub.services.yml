services:
  genehub.menu_cache_invalidator:
    class: Drupal\genehub\MenuCacheInvalidator
    arguments: ['@queue', '@http_client', '@logger.factory']
    tags:
      - { name: event_subscriber }

  genehub.product_route_sync_client:
    class: Drupal\genehub\ProductRouteSyncClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.factory'

  genehub.ai_openai_compatible_params_default_subscriber:
    class: Drupal\genehub\EventSubscriber\OpenAiCompatibleParamsDefaultSubscriber
    arguments:
      - '@config.factory'
    tags:
      - { name: event_subscriber }

  genehub.workspace_id_negotiator:
    class: Drupal\genehub\Workspace\WorkspaceIdNegotiator
    tags:
      - { name: workspace_negotiator, priority: 150 }
