genemedi_i18n_workflow.api_fail:
  path: '/api/genemedi-i18n/tasks/{task}/fail'
  defaults:
    _controller: '\Drupal\genemedi_i18n_workflow\Controller\TaskApiController::fail'
  methods: [POST]
  requirements:
    _permission: 'execute genemedi i18n workflow'
    _user_is_logged_in: 'TRUE'
    task: '\d+'
    _csrf_request_header_token: 'TRUE'
