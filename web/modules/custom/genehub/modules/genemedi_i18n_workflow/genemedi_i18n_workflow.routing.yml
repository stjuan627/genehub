genemedi_i18n_workflow.api_begin_import:
  path: '/api/genemedi-i18n/tasks/{task}/begin-import'
  defaults:
    _controller: '\Drupal\genemedi_i18n_workflow\Controller\TaskApiController::beginImport'
  methods: [POST]
  requirements:
    _permission: 'execute genemedi i18n workflow'
