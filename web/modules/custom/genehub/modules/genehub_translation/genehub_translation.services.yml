services:
  genehub_translation.terminology:
    class: Drupal\genehub_translation\TerminologyManager
    arguments:
      - '@config.factory'

  genehub_translation.ai_translation_subscriber:
    class: Drupal\genehub_translation\EventSubscriber\AiTranslationSubscriber
    arguments:
      - '@genehub_translation.terminology'
      - '@language_manager'
    tags:
      - { name: event_subscriber }

  genehub_translation.ai_translate_request_capture_subscriber:
    class: Drupal\genehub_translation\EventSubscriber\AiTranslateRequestCaptureSubscriber
    arguments:
      - '@state'
      - '@datetime.time'
    tags:
      - { name: event_subscriber }

  genehub_translation.route_subscriber:
    class: Drupal\genehub_translation\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
