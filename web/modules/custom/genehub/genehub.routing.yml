genehub.menu_v1:
  path: '/v1/menus/{menu_name}'
  defaults:
    _controller: '\Drupal\genehub\Controller\MenuController::view'
  requirements:
    _access: 'TRUE'
    menu_name: '[a-z0-9-]+'
  methods: [GET]
  options:
    no_cache: TRUE

genehub.genemedi_header_menu:
  path: '/genehub/menus/genemedi/header/{langcode}'
  defaults:
    _controller: '\Drupal\genehub\Controller\MenuController::legacyGenemediHeader'
  requirements:
    _access: 'TRUE'
    langcode: '[a-z]{2,3}(?:-[a-z0-9]{2,8})*'
  methods: [GET]
  options:
    no_cache: TRUE

genehub.products:
  path: '/admin/content/products'
  defaults:
    _controller: '\Drupal\genehub\Controller\ProductController::overview'
    _title: 'Products'
  requirements:
    _permission: 'access content overview'
  options:
    _admin_route: TRUE

genehub.products_add:
  path: '/admin/content/products/add'
  defaults:
    _controller: '\Drupal\genehub\Controller\ProductController::addOverview'
    _title: 'Add product'
  requirements:
    _permission: 'access content overview'
  options:
    _admin_route: TRUE

genehub.products_settings:
  path: '/admin/structure/products'
  defaults:
    _controller: '\Drupal\genehub\Controller\ProductController::settingsOverview'
    _title: 'Product settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE

genehub.product_route_sync_settings:
  path: '/admin/structure/products/route-sync'
  defaults:
    _form: '\Drupal\genehub\Form\ProductRouteSyncSettingsForm'
    _title: 'Legacy route synchronization'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
