services:
  content_dashboard.change_detector:
    class: Drupal\content_dashboard\Service\MajorChangeDetector
    arguments:
      - '@config.factory'

  content_dashboard.change_log_repository:
    class: Drupal\content_dashboard\Service\ChangeLogRepository
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@content_dashboard.change_detector'
